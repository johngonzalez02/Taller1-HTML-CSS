<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Responsive Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <header class="encabezado">
            <h1>Página Responsive</h1>
        </header>

        <div class="contenido">
            <p>
                Este contenedor cambia su ancho dependiendo del tamaño 
                de la pantalla. En escritorio ocupa un ancho fijo, 
                mientras que en dispositivos móviles se adapta para 
                ocupar todo el espacio disponible.
            </p>
        </div>
    </div>

</body>
</html>
