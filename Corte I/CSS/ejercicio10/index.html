<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Pseudoclases</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Pseudoclases en CSS</h1>

    <h2>Menú</h2>
    <nav class="menu">
        <a href="#">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">Contacto</a>
    </nav>

    <h2>Formulario</h2>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo">
    </form>

    <h2>Lista</h2>
    <ul class="lista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
        <li>Elemento 4</li>
        <li>Elemento 5</li>
    </ul>

</body>
</html>
