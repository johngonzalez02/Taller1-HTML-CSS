<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Formularios básicos</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required><br><br>

        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required><br><br>

        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" required><br><br>

        <button type="submit">Registrarse</button>
    </form>

</body>
</html>
